name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK and Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          echo -e "24333f8a6356b24488243e05e54285d6140e63f1\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24e8f3108867a32d8495d4356d08c1c12e0849e8" > "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore and Environment
        run: |
          touch .env
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat << 'EOF' > debug.keystore.base64
          
          EOF
          base64 -d debug.keystore.base64 > debug.keystore
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Naseeb-Lal-Market-v2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
